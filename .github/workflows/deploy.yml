name: Deploy to GitHub Pages

# Runs only after CI succeeds on main, never straight off a push.
#
# GitHub has no cross-workflow `needs`, so a push-triggered deploy publishes
# whatever was pushed regardless of whether the tests passed. That is exactly
# backwards for the one workflow that makes the build public. `workflow_run`
# with a conclusion check is the only way to express the dependency.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Workflow-level: read the code and nothing else.
#
# The build job below runs `npm ci` and `npm run build` over a checkout of the
# commit that triggered CI, which means it executes package.json lifecycle
# scripts and a vite config from that commit. Whatever token that job holds is
# a token those scripts hold. Pages write and OIDC token minting live on the
# deploy job, which runs no code from the checkout at all.
permissions:
  contents: read

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages IS enabled on this repository, so this gate passes and the jobs below
  # it run. It is kept because the state it guards against is real and silent:
  # if Pages is ever turned off, every deploy fails at the last step with an API
  # error that reads like a broken workflow, and a workflow that is always red
  # is a workflow nobody reads. This skips with a reason instead.
  #
  # It is NOT a publication control. The comment here used to say publishing was
  # gated on a data marking decision, which stopped being true the day Pages was
  # switched on, and a stale claim that something is disabled is worse than no
  # claim at all. What keeps controlled content out of the build is
  # scripts/check-no-real-data.mjs and the pre-commit hook, not this step.
  #
  # It reads has_pages off the repository instead of calling GET .../pages,
  # which needs a Pages-scoped token that only the deploy job holds. This job
  # used to call it anyway and read any failure as "Pages is off", so when
  # 70492f4 narrowed the workflow token to contents: read, every deploy after
  # it skipped green under a notice saying Pages was disabled, while the site
  # kept serving the build before it. The repository endpoint needs only the
  # metadata scope every token carries, and an answer that is not exactly true
  # or false now fails the job, so a skip always means Pages really is off.
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_pages) || {
            echo "::error::Could not read has_pages for ${GITHUB_REPOSITORY}, so whether Pages is on is unknown. The gh error is above."
            exit 1
          }
          case "$enabled" in
            true) ;;
            false) echo "::notice::Pages is not enabled for this repository, so there is nothing to deploy. Enable Pages in the repository settings to activate this workflow." ;;
            *) echo "::error::Expected has_pages to be true or false, got '${enabled}'."; exit 1 ;;
          esac
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

  # This job runs code out of the checked-out commit, so it gets the smallest
  # token there is and every condition below has to hold before it starts.
  #
  # `branches: [main]` on the trigger is not a guard. It matches
  # workflow_run.head_branch, which is the branch name in the HEAD repository,
  # and on a pull request from a fork that is a name the PR author picked. CI
  # triggers on a bare `pull_request`, so a fork PR does produce a CI run that
  # concludes success, and without the two checks below this job would then
  # check out the fork's commit and run `npm ci` on it, executing that fork's
  # package.json lifecycle scripts. That is the pwn-request shape.
  #
  # It has not been exploitable because the repository is private with a single
  # collaborator. That is a repository setting, not a guard: it is not visible
  # from this file, nothing here depends on it, and it stops being true the
  # moment the repo is opened up or someone is added.
  #
  #   head_repository.full_name == github.repository  the run came from HERE,
  #                                                   not from a fork
  #   workflow_run.event == 'push'                    it came from a push to
  #                                                   main, not a pull request
  build:
    needs: gate
    permissions:
      contents: read
    if: >-
      needs.gate.outputs.enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch, not the commit that
          # triggered CI, so without this the deployed build is whatever main
          # happens to be now rather than the commit the tests actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # public/data is generated and gitignored, so a fresh checkout has none
      # and the build would ship an app with no data in it.
      - run: node scripts/seed-data.mjs
      - run: npm run build
      # The whole of dist, which includes the 404.html the build writes. Pages
      # serves that document for any path naming no file, which is what makes
      # /network and /map open instead of 404ing. Without it every shared link
      # but the root is dead. See the fallback plugin in vite.config.ts and
      # e2e/deep-link.spec.ts.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The only job that holds a Pages-scoped token and can mint an OIDC token, and
  # the only one that checks out nothing and runs nothing from the repository.
  # It publishes an artifact another job already built.
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Moved here from the build job. Its outputs are unused (the base path is
      # ATLAS_BASE plus public/CNAME, see vite.config.ts), and it reads the
      # Pages API, so leaving it in the build job would have forced a
      # Pages-scoped token onto the job that runs npm ci.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
