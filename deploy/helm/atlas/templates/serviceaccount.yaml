{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atlas.serviceAccountName" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Its own account with no token mounted, rather than the namespace default,
# so nothing granted to "default" later reaches this pod.
automountServiceAccountToken: false
{{- end }}
