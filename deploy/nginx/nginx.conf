# ATLAS: the whole nginx configuration for the container image.
#
# This replaces the base image's nginx.conf outright, so there is no
# conf.d/default.conf and no entrypoint script rewriting anything at start-up.
# That is what makes a read-only root filesystem work: the only path nginx
# writes is /tmp (pid and temp files), which the chart mounts as an emptyDir
# and `docker run --read-only --tmpfs /tmp` provides locally.
#
# The server serves files and nothing else. No proxy_pass, no resolver, no
# upstream: nothing in here makes a request, so the container cannot phone
# home, and the chart's NetworkPolicy denies egress on top of that.
#
# What the behaviour is FOR is in docs/kubernetes.md and is asserted, from a
# client, by scripts/smoke-http.mjs. Change one, run the other.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    # The path only, never the query string, and nothing that identifies the
    # reader. A view's query names a site and the devices in focus, which is
    # what a reader was looking at, and the hosted app's promise is that
    # nothing a user does is kept. The ingress controller's own logs are the
    # platform's to configure.
    #
    # $uri would log every view as /index.html once the fallback has run, so
    # the path is cut from the request line as the reader sent it.
    map $request_uri $atlas_requested_path {
        ~^(?<path>[^?]*)  $path;
        default           "";
    }
    log_format atlas escape=json
        '{"time":"$time_iso8601","method":"$request_method",'
        '"path":"$atlas_requested_path","status":$status,'
        '"bytes":$body_bytes_sent,"seconds":$request_time}';
    access_log /dev/stdout atlas;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cache policy by the path that is finally served, after any fallback.
    #
    # Files under /assets/ carry a content hash in their names and change name
    # on every build, so a browser may keep them forever. Everything else, the
    # document above all, is revalidated on each load, so a new deploy shows up
    # on the next page load rather than whenever a cache expires. The data
    # bundle has no hash in its names, so it revalidates too.
    #
    # Set below without `always`, so it lands on successful responses only and
    # a 404 for a missing asset is never cached for a year.
    map $uri $atlas_cache_control {
        default      "no-cache";
        ~^/assets/   "public, max-age=31536000, immutable";
        /healthz     "no-store";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Any redirect nginx makes uses a relative Location, never the pod's
        # own host and port, which are meaningless behind an ingress.
        absolute_redirect off;

        add_header Cache-Control $atlas_cache_control;

        # Headers GitHub Pages does not let us set. frame-ancestors only works
        # as a header (index.html says so beside its meta CSP), and a policy
        # holding nothing else restricts nothing else: the meta tag still
        # governs scripts, styles and connections. `always`, so a 404 carries
        # them too.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build output and the data bundle are files or nothing. A miss
        # here is a real 404: the application document served as a JavaScript
        # module or as JSON is a parse error that hides the actual problem.
        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ^~ /data/ {
            try_files $uri =404;
        }

        # Every other path is either a real file (index.html, 404.html,
        # favicon.svg) or a view. A view gets the application document, at the
        # URL the reader asked for, with a 200: no redirect, so the query is
        # never touched, and the router reads the address exactly as it would
        # anywhere. A route the app does not have gets the app's own "Page not
        # found" the same way.
        #
        # GitHub Pages answers a deep link with 404.html and a 404 status,
        # because a static host cannot know which paths are views. This server
        # can, and a 404 status here would let an ingress controller configured
        # with custom error pages swap the application for its own error page.
        location / {
            try_files $uri /index.html;
        }
    }
}
